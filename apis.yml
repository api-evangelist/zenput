name: Zenput
description: >-
  Zenput (now Crunchtime Ops Execution) is an operations-execution platform for
  multi-unit restaurant and convenience-store operators, used across 60,000+
  locations in 100+ countries to run task management, audits and food-safety
  compliance, temperature monitoring, food-prep labeling, and store-level
  operational workflows. Zenput exposes a RESTful HTTP API (documented at
  developer.zenput.com) for submissions/form data, locations, users and roles,
  teams, tasks, sensors, calendar events / operating hours, general attributes,
  and field-business-consultant (FBC) assignments. The API authenticates with a
  per-user X-API-TOKEN header, is versioned in the URL path (v1 and v3), and
  provides a large-batch submissions retrieval flow with token-based paging plus
  a staging environment for testing. Zenput was acquired by Crunchtime in 2022
  and continues to operate its developer platform under the Zenput brand.
